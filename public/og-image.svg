<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Белый фон -->
  <rect width="1200" height="630" fill="#ffffff"/>
  
  <!-- Логотип (слева) -->
  <!-- Сдвинут так, чтобы его визуальный центр был на оси Y=315 -->
  <g transform="translate(235, 155) scale(1.2)">
    <path d="M 52 40 L 204 40 Q 216 40 216 52 L 216 175 L 190 190 L 215 200 L 180 210 L 210 215 L 170 216 L 52 216 Q 40 216 40 204 L 40 52 Q 40 40 52 40 Z" fill="none" stroke="#1a1a1a" stroke-width="12" stroke-linejoin="round"/>
    <text x="128" y="165" font-family="Arial, sans-serif" font-size="110" font-weight="bold" text-anchor="middle" fill="#1a1a1a">47</text>
  </g>
  
  <!-- Текст (справа от логотипа) -->
  <!-- Выровнен по левому краю (text-anchor="start"), но вся группа сбалансирована по центру холста -->
  <g text-anchor="start">
    <!-- Заголовок: базовая линия Y=295 (визуальный центр ~315) -->
    <text x="615" y="310" font-family="Arial, sans-serif" font-size="84" font-weight="bold" fill="#1a1a1a" letter-spacing="-1">47m2</text>
    <!-- Подзаголовок: базовая линия Y=345 (визуальный центр ~315) -->
    <text x="615" y="365" font-family="Arial, sans-serif" font-size="36" fill="#666666" letter-spacing="0.5">Блог о недвижимости и жизни</text>
  </g>
</svg>